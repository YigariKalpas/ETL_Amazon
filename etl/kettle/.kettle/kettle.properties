# ============================================================
# PDI / Kettle 全局属性
# 生效位置：%KETTLE_HOME%\.kettle\kettle.properties
# 本项目 KETTLE_HOME = <project>\etl\kettle（只填到 .kettle 的父目录）
# 本文件不含任何凭据，可提交入库。
# ============================================================

# --- 日期与数字规范（与作业对有日期精度的要求配合）---
# 仅年份的场景不要在此处补默认值，交由转换中的字段级规则处理
KETTLE_DEFAULT_DATE_FORMAT=yyyy-MM-dd
KETTLE_DEFAULT_TIMESTAMP_FORMAT=yyyy-MM-dd HH:mm:ss
KETTLE_DEFAULT_INTEGER_FORMAT=#
KETTLE_DEFAULT_NUMBER_FORMAT=#.###############

# --- 日志规模（作业要求保留执行日志与失败分支）---
KETTLE_LOG_SIZE_LIMIT=100
KETTLE_MAX_LOG_SIZE_IN_LINES=20000

# --- 大数据量抽取：控制回滚日志与内存 ---
KETTLE_EMPTY_STRING_DIFFERS_FROM_NULL=N

# --- 执行日志落库（待 P0-3 数据库选型确定后启用，以下为占位示例）---
# KETTLE_TRANS_LOG_DB=ETL_META
# KETTLE_JOB_LOG_DB=ETL_META
# KETTLE_TRANS_PERFORMANCE_LOG_DB=ETL_META
# KETTLE_CHANNEL_LOG_DB=ETL_META

# --- JDBC 驱动集中目录（可选，放于 data-integration\lib 即可）---
# KETTLE_JNDI_ROOT=
